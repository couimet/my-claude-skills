name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: couimet/github-actions/markdownlint@main

      - uses: couimet/github-actions/prettier@main

  shell-ci-checks:
    uses: couimet/github-actions/.github/workflows/shell-ci-checks.yml@main
    with:
      shellcheck-timeout-minutes: 3
      bats-test-timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
